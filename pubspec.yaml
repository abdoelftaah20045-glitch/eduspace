name: eduspace_app
description: "EduSpace student app."
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  image_picker: ^1.1.2
  file_picker: ^13.4.1
  sentry_flutter: ^10.6.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  path_provider: ^2.1.4
  pdf: ^3.11.0
  barcode: ^2.2.0
  printing: ^5.13.0
  intl: any
  http: ^1.2.0
  open_filex: ^4.5.0
  archive: any
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^23.0.4
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/brand/
    - shorebird.yaml
  fonts:
    - family: Marhey
      fonts:
        - asset: assets/fonts/Marhey.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
