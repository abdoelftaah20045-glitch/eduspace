name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shorebird_mode:
        description: 'none = normal build; release = Shorebird release (full APK, patchable baseline); patch = Dart-only patch for an existing release'
        default: 'none'
        type: choice
        options: [none, release, patch]
      release_version:
        description: 'patch mode only: release version to patch, e.g. 0.2.0+114'
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name eduspace_app .

      - name: Light launch background (no black screen at start)
        continue-on-error: true
        run: python3 ci/patch_launch_theme.py

      - name: Screen protection (FLAG_SECURE) in MainActivity
        run: sh ci/patch_mainactivity.sh

      - name: App icon from assets/logo.png
        continue-on-error: true
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          src = Image.open('assets/logo.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for k, v in sizes.items():
              d = f'android/app/src/main/res/mipmap-{k}'
              os.makedirs(d, exist_ok=True)
              src.resize((v, v), Image.LANCZOS).save(f'{d}/ic_launcher.png')
          # Adaptive icon (Android 8+): foreground + background layers
          d = 'android/app/src/main/res/drawable-xxxhdpi'
          os.makedirs(d, exist_ok=True)
          for n, p in (('ic_fg', 'adaptive_foreground_1024'), ('ic_bg', 'adaptive_background_1024')):
              Image.open(f'assets/brand/{p}.png').convert('RGBA').resize((432, 432), Image.LANCZOS).save(f'{d}/{n}.png')
          d = 'android/app/src/main/res/mipmap-anydpi-v26'
          os.makedirs(d, exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@drawable/ic_bg"/><foreground android:drawable="@drawable/ic_fg"/></adaptive-icon>'
          open(f'{d}/ic_launcher.xml', 'w').write(xml)
          PY

      - name: App display name
        run: sed -i 's/android:label="[^"]*"/android:label="Deki"/' android/app/src/main/AndroidManifest.xml

      - name: Patch Android config (permissions + signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Release builds need INTERNET permission (flutter create adds it to debug/profile only)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i '0,/<manifest /a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' "$MANIFEST"
          fi
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          head -4 "$MANIFEST"
          # Stable release keystore when secrets exist, debug signing otherwise
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi
          GRADLE=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && GRADLE=android/app/build.gradle.kts
          echo "Gradle file: $GRADLE"
          # file_picker's flutter_plugin_android_lifecycle requires compileSdk 37+
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' "$GRADLE"
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 37/' "$GRADLE"
          # Deki application id (namespace stays as generated; the manifest uses relative class names).
          sed -i 's/applicationId = "com.example.eduspace_app"/applicationId = "com.deki.app"/; s/applicationId "com.example.eduspace_app"/applicationId "com.deki.app"/' "$GRADLE"
          grep -n 'applicationId' "$GRADLE"
          grep -q 'applicationId.*"com.deki.app"' "$GRADLE" || { echo "applicationId patch failed"; exit 1; }
          if [ "$GRADLE" = "android/app/build.gradle.kts" ]; then
            cat ci/release-signing.gradle.kts >> "$GRADLE"
          else
            cat ci/release-signing.gradle >> "$GRADLE"
          fi
          tail -20 "$GRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (informational)
        run: flutter analyze
        continue-on-error: true

      - name: Unit and widget tests
        run: |
          rm -f test/widget_test.dart
          flutter test --reporter expanded
        continue-on-error: true

      - name: Build release APKs (split per ABI)
        if: ${{ inputs.shorebird_mode == '' || inputs.shorebird_mode == 'none' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=FCM_ENABLED=${{ secrets.FCM_ENABLED }}
          --dart-define=PUSH_LIVE=${{ secrets.PUSH_LIVE }}
          --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
          --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
          --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
          --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}
          --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Set up Shorebird
        if: ${{ inputs.shorebird_mode == 'release' || inputs.shorebird_mode == 'patch' }}
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Shorebird release (one full APK, baseline for patches)
        if: ${{ inputs.shorebird_mode == 'release' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          shorebird release android --artifact apk --target-platform android-arm64
          --flutter-version=latest --build-number=${{ github.run_number }}
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=FCM_ENABLED=${{ secrets.FCM_ENABLED }}
          --dart-define=PUSH_LIVE=${{ secrets.PUSH_LIVE }}
          --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }}
          --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }}
          --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }}
          --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}
          --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Shorebird patch (Dart-only update, small download)
        if: ${{ inputs.shorebird_mode == 'patch' }}
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          RV="${{ inputs.release_version }}"
          [ -n "$RV" ] || { echo "release_version is required for patch"; exit 1; }
          RB="${RV#*+}"
          shorebird patch android --release-version="$RV" --artifact apk \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=FCM_ENABLED=${{ secrets.FCM_ENABLED }} \
            --dart-define=PUSH_LIVE=${{ secrets.PUSH_LIVE }} \
            --dart-define=FB_API_KEY=${{ secrets.FB_API_KEY }} \
            --dart-define=FB_APP_ID=${{ secrets.FB_APP_ID }} \
            --dart-define=FB_SENDER_ID=${{ secrets.FB_SENDER_ID }} \
            --dart-define=FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }} \
            --dart-define=APP_BUILD="$RB"

      - name: Name the Shorebird APK like a normal arm64 build
        if: ${{ inputs.shorebird_mode == 'release' }}
        run: |
          mkdir -p build/app/outputs/flutter-apk
          F=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1)
          echo "release apk: $F"
          [ -n "$F" ] && [ "$F" != "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ] && cp "$F" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || true
          ls -l build/app/outputs/flutter-apk/

      - name: Show APK sizes
        if: ${{ inputs.shorebird_mode != 'patch' }}
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        if: ${{ inputs.shorebird_mode != 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: eduspace-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Update latest release
        if: ${{ inputs.shorebird_mode != 'patch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          FILES=$(ls build/app/outputs/flutter-apk/app-*-release.apk)
          gh release create latest $FILES \
            --title "Latest APK" \
            --prerelease \
            --notes "Latest successful build from main. Most phones: arm64-v8a. Signed with the stable EduSpace release key when signing secrets are set, otherwise the debug key."

      - name: Publish update feed (public releases repo)
        if: ${{ inputs.shorebird_mode != 'patch' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping"; exit 0; fi
          if [ "$(tr -d ' \n' < ci/publish.txt 2>/dev/null || echo yes)" != "yes" ]; then echo "ci/publish.txt is not yes: feed untouched"; exit 0; fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk deki.apk
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NOTES=$(git log -1 --pretty=%s | head -c 200 | tr -d '"\\')
          # ci/min_build.txt: "latest" = every update is mandatory, 0 = optional,
          # or a number = builds older than that must update.
          MB=$(tr -d ' \n' < ci/min_build.txt 2>/dev/null || echo 0)
          [ "$MB" = "latest" ] && MB=${{ github.run_number }}
          printf '{"build": %s, "min_build": %s, "version": "%s", "apk": "deki.apk", "notes": "%s"}\n' \
            "${{ github.run_number }}" "$MB" "$VERSION" "$NOTES" > version.json
          cat version.json
          R=abdoelftaah20045-glitch/deki-releases
          gh release delete latest --repo $R --yes --cleanup-tag 2>/dev/null || true
          gh release create latest deki.apk version.json --repo $R \
            --title "Deki build ${{ github.run_number }}" \
            --notes "Update feed for the in-app updater."
