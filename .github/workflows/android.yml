name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name eduspace_app .

      - name: Patch Android config (permissions + signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Release builds need INTERNET permission (flutter create adds it to debug/profile only)
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi
          head -4 "$MANIFEST"
          # Stable release keystore when secrets exist, debug signing otherwise
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi
          GRADLE=android/app/build.gradle
          [ -f android/app/build.gradle.kts ] && GRADLE=android/app/build.gradle.kts
          echo "Gradle file: $GRADLE"
          if [ "$GRADLE" = "android/app/build.gradle.kts" ]; then
            cat ci/release-signing.gradle.kts >> "$GRADLE"
          else
            cat ci/release-signing.gradle >> "$GRADLE"
          fi
          tail -20 "$GRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis (informational)
        run: flutter analyze
        continue-on-error: true

      - name: Build release APKs (split per ABI)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=FCM_ENABLED=${{ secrets.FCM_ENABLED }}

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eduspace-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          gh release create latest \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            --title "Latest APK" \
            --prerelease \
            --notes "Latest successful build from main. Most phones: arm64-v8a. Signed with the stable EduSpace release key when signing secrets are set, otherwise the debug key."
